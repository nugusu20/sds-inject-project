name: CD

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target host or IP"
        required: false
        type: string
      target_user:
        description: "SSH user"
        required: false
        type: string
      ssh_port:
        description: "SSH port"
        required: false
        default: "22"
        type: string
      apiserver_advertise_address:
        description: "Kubernetes API server advertise address"
        required: false
        type: string
      pod_cidr:
        description: "Kubernetes pod CIDR"
        required: false
        default: "10.244.0.0/16"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TARGET_HOST: ${{ github.event.inputs.target_host || secrets.CD_TARGET_HOST }}
      TARGET_USER: ${{ github.event.inputs.target_user || secrets.CD_TARGET_USER }}
      TARGET_PORT: ${{ github.event.inputs.ssh_port || secrets.CD_SSH_PORT || '22' }}
      APISERVER_ADVERTISE_ADDRESS: ${{ github.event.inputs.apiserver_advertise_address || secrets.CD_APISERVER_ADVERTISE_ADDRESS }}
      POD_CIDR: ${{ github.event.inputs.pod_cidr || secrets.CD_POD_CIDR || '10.244.0.0/16' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Build installer
        run: ./build-script

      - name: Configure SSH key
        run: |
          test -n "${{ secrets.CD_SSH_PRIVATE_KEY }}"
          mkdir -p ~/.ssh
          printf '%s
' "${{ secrets.CD_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/sds_cd_key
          chmod 600 ~/.ssh/sds_cd_key

      - name: Deploy installer
        run: |
          set -euo pipefail

          : "${TARGET_HOST:?CD target host is required}"
          : "${TARGET_USER:?CD target user is required}"

          args=(
            --target "${TARGET_USER}@${TARGET_HOST}"
            --port "${TARGET_PORT}"
            --identity-file "$HOME/.ssh/sds_cd_key"
            --installer "dist/sds-inject-installer.run"
            --pod-cidr "${POD_CIDR}"
          )

          if [[ -n "${APISERVER_ADVERTISE_ADDRESS:-}" ]]; then
            args+=(--apiserver-advertise-address "${APISERVER_ADVERTISE_ADDRESS}")
          fi

          ./cd/deploy-installer.sh "${args[@]}"
